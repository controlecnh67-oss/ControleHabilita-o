name: Apply citizen sync integration

on:
  push:
    branches:
      - fix/sync-cidadao-seguranca

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch db service
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'src/services/db.ts';
            const branch = 'fix/sync-cidadao-seguranca';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const current = Buffer.from(file.data.content, 'base64').toString('utf8');
            let s = current;

            const oldFetch = `export async function fetchAcessosCidadaoLogs(): Promise<AcessoCidadaoLog[]> {
  const local = getAcessosCidadaoLogs();
  if (!isSupabaseConfigured()) {
    return local;
  }
  try {
    const { data, error } = await supabase
      .from("acessos_cidadao")
      .select("*")
      .order("data_hora", { ascending: false })
      .limit(500);

    if (!error && data && data.length > 0) {
      const map = new Map<string, AcessoCidadaoLog>();
      data.forEach((d: any) => map.set(d.id, d));
      local.forEach((l) => {
        if (!map.has(l.id)) {
          map.set(l.id, l);
        }
      });
      const merged = Array.from(map.values()).sort(
        (a, b) => new Date(b.data_hora).getTime() - new Date(a.data_hora).getTime()
      );
      if (typeof window !== "undefined") {
        localStorage.setItem("detran_acessos_cidadao_logs", JSON.stringify(merged.slice(0, 500)));
      }
      return merged;
    }
  } catch (e) {
    console.warn("Aviso ao sincronizar acessos do cidadão do Supabase:", e);
  }
  return local;
}`;
            const newFetch = `export async function fetchAcessosCidadaoLogs(): Promise<AcessoCidadaoLog[]> {
  const local = getAcessosCidadaoLogs();
  if (!isSupabaseConfigured()) return local;
  try {
    const remote = await fetchAllRowsFromSupabase<AcessoCidadaoLog>("acessos_cidadao", 1000, "data_hora", false);
    const map = new Map<string, AcessoCidadaoLog>();
    for (const item of local) map.set(item.id, item);
    for (const item of remote) map.set(item.id, item);
    const merged = Array.from(map.values()).sort((a, b) => new Date(b.data_hora).getTime() - new Date(a.data_hora).getTime());
    if (typeof window !== "undefined") localStorage.setItem("detran_acessos_cidadao_logs", JSON.stringify(merged.slice(0, 500)));
    return merged;
  } catch (e) {
    console.warn("Aviso ao sincronizar acessos do cidadão do Supabase:", e);
    return local;
  }
}`;
            if (!s.includes(oldFetch)) core.setFailed('fetchAcessosCidadaoLogs block not found');
            else s = s.replace(oldFetch, newFetch);

            const oldInsert = `  // Enviar para Supabase em segundo plano se configurado
  if (isSupabaseConfigured()) {
    (async () => {
      try {
        await supabase.from("acessos_cidadao").insert([{
          id: newLog.id,
          numero: newLog.numero,
          data_hora: newLog.data_hora,
          cpf: newLog.cpf,
          nome_titular: newLog.nome_titular || null,
          situacao: newLog.situacao,
          resultado_status: newLog.resultado_status,
          canal: newLog.canal,
          dispositivo: newLog.dispositivo || null,
          cidade_origem: newLog.cidade_origem || null,
          ip_mascarado: newLog.ip_mascarado || null
        }]);
      } catch {
        // Tabela acessos_cidadao pode ainda não estar criada no Supabase
      }
    })();
  }`;
            const newInsert = `  // Registrar remotamente pela RPC. O cliente público não recebe INSERT direto na tabela.
  if (isSupabaseConfigured()) {
    (async () => {
      try {
        const { error } = await supabase.rpc("registrar_acesso_cidadao", {
          p_id: newLog.id,
          p_numero: newLog.numero,
          p_data_hora: newLog.data_hora,
          p_cpf: newLog.cpf,
          p_nome_titular: newLog.nome_titular || null,
          p_situacao: newLog.situacao,
          p_resultado_status: newLog.resultado_status,
          p_canal: newLog.canal,
          p_dispositivo: newLog.dispositivo || null,
          p_cidade_origem: newLog.cidade_origem || null,
          p_ip_mascarado: newLog.ip_mascarado || null
        });
        if (error) throw error;
      } catch (e) {
        console.warn("Aviso ao registrar acesso do cidadão no Supabase:", e);
      }
    })();
  }`;
            if (!s.includes(oldInsert)) core.setFailed('citizen log insert block not found');
            else s = s.replace(oldInsert, newInsert);

            const marker = '  // Se o Supabase estiver configurado, busca diretamente e em tempo real na tabela remota do Supabase pelo CPF';
            const start = s.indexOf(marker);
            const endMarker = '  const todasCNHs = await getGeralCNHs();';
            const end = s.indexOf(endMarker, start);
            if (start < 0 || end < 0) core.setFailed('public CPF query block not found');
            else {
              const rpcBlock = `  // Consulta pública usa a RPC protegida e retorna somente registros do CPF informado.
  if (isSupabaseConfigured()) {
    try {
      const { data, error } = await supabase.rpc("consulta_cnh_publica", { p_cpf: cleanCpf });
      if (!error && Array.isArray(data) && data.length > 0) {
        directSupabaseCNHs = data as GeralCNH[];
      }
    } catch (err) {
      console.warn("Aviso ao consultar a CNH pela RPC pública:", err);
    }
  }

`;
              s = s.slice(0, start) + rpcBlock + s.slice(end);
            }

            const oldAll = `  const todasCNHs = await getGeralCNHs();

  // Mesclar dados do Supabase com o cache local
  const mapById = new Map<string, GeralCNH>();`;
            const newAll = `  // Se o Supabase respondeu, não carregue a tabela inteira apenas para uma consulta por CPF.
  const todasCNHs = directSupabaseCNHs.length > 0 ? directSupabaseCNHs : await getGeralCNHs();

  // Mesclar dados do Supabase com o cache local
  const mapById = new Map<string, GeralCNH>();`;
            if (!s.includes(oldAll)) core.setFailed('full geral query block not found');
            else s = s.replace(oldAll, newAll);

            if (s !== current) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                message: 'fix(sync): integrate citizen Supabase RPCs',
                content: Buffer.from(s, 'utf8').toString('base64'),
                sha: file.data.sha,
                branch
              });
            }

      - name: Remove patch workflow
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/apply-db-integration.yml';
            const file = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'fix/sync-cidadao-seguranca' });
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore(ci): remove temporary citizen sync patcher',
              sha: file.data.sha,
              branch: 'fix/sync-cidadao-seguranca'
            });
